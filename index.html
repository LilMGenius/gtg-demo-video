<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골키퍼 키우기 3D 데모</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#snd{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:none;
  padding:18px 30px;border:0;border-radius:999px;background:#f2b431;color:#1b1b1b;
  font:700 20px/1 system-ui,sans-serif;cursor:pointer}
</style>
<video src="demo.mp4" controls autoplay playsinline></video>
<button id="snd">🔊 소리 켜기</button>
<script>
const v = document.querySelector("video");
const b = document.getElementById("snd");
// 음소거 자동재생은 브라우저가 허용하고, 소리 있는 자동재생은 막는다.
// 막혔을 때 음소거로 떨어뜨리고 끝내면 영상은 끝까지 무음으로 돈다. 다시 켤 손잡이를 남긴다.
const on = () => {
  v.muted = false;
  v.volume = 1;
  b.style.display = "none";
  v.play().catch(() => {});
  document.removeEventListener("pointerdown", on);
  document.removeEventListener("keydown", on);
};
v.play().catch(() => {
  v.muted = true;
  v.play().catch(() => {});
  b.style.display = "block";
  document.addEventListener("pointerdown", on);
  document.addEventListener("keydown", on);
});
b.addEventListener("click", on);
</script>
</html>
