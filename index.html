<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>골키퍼 키우기 3D 데모</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#gate{position:fixed;inset:0;z-index:2;display:none;border:0;padding:0;cursor:pointer;
  background:rgba(0,0,0,.55);color:#f2b431;
  font:700 clamp(20px,4vw,38px)/1.5 system-ui,sans-serif}
</style>
<video src="demo.mp4" controls playsinline></video>
<button id="gate">🔊 소리 켜고 재생</button>
<script>
const v = document.querySelector("video");
const gate = document.getElementById("gate");
// 버튼을 화면 안에 작게 놓으면 그 클릭이 video 위로 새고, controls가 그것을 일시정지로 받는다.
// 덮개를 화면 전체로 깔아 클릭을 하나만 받는다.
const play = () => {
  gate.style.display = "none";
  v.muted = false;
  v.volume = 1;
  v.play().catch(() => { gate.style.display = "block"; });
};
gate.addEventListener("click", play);
v.play().then(play).catch(() => { gate.style.display = "block"; });
</script>
</html>
